# =============================================================================
# GitHub Actions - Production Deployment (Vercel)
# saas-zero: Next.js 14 + Supabase + Vercel + Stripe + Brevo
# Manual trigger + push to main with manual approval required
# =============================================================================

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      skip_smoke_tests:
        description: "Skip smoke tests (emergency only)"
        required: false
        default: false
        type: boolean
      force_deploy:
        description: "Force deploy even if CI failed"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy.yml"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # ===========================================================================
  # PRE-DEPLOY CHECK - Verify CI passed
  # ===========================================================================
  pre-deploy-check:
    name: Pre-Deploy Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_passed: ${{ steps.check.outputs.ci_passed }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Get commit SHA
        id: sha
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Check CI status
        id: check
        run: |
          CI_STATUS=$(gh run list --commit ${{ github.sha }} --workflow=CI --limit=1 --json conclusion --jq '.[0].conclusion')
          echo "CI Status: $CI_STATUS"

          if [ "${{ github.event.inputs.force_deploy }}" = "true" ]; then
            echo "Force deploy enabled - skipping CI check"
            echo "ci_passed=true" >> $GITHUB_OUTPUT
          elif [ "$CI_STATUS" = "success" ]; then
            echo "ci_passed=true" >> $GITHUB_OUTPUT
          else
            echo "ci_passed=false" >> $GITHUB_OUTPUT
            echo "❌ CI did not pass for this commit. Use force_deploy to override."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify required secrets
        run: |
          REQUIRED_SECRETS=(
            "VERCEL_TOKEN"
            "VERCEL_ORG_ID"
            "VERCEL_PROJECT_ID"
            "SUPABASE_ACCESS_TOKEN"
            "SUPABASE_PROJECT_REF"
            "STRIPE_SECRET_KEY"
            "STRIPE_WEBHOOK_SECRET"
            "BREVO_API_KEY"
          )

          for secret in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${{ secrets[$secret] }}" ]; then
              echo "❌ Missing required secret: $secret"
              exit 1
            fi
          done
          echo "✅ All required secrets present"

  # ===========================================================================
  # MANUAL APPROVAL - Required for production
  # ===========================================================================
  approval:
    name: Manual Approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre-deploy-check
    if: ${{ needs.pre-deploy-check.outputs.ci_passed == 'true' && github.event_name != 'pull_request' }}
    environment: production
    steps:
      - name: Wait for approval
        run: |
          echo "🚀 Deployment to ${{ github.event.inputs.environment || 'production' }} requires manual approval"
          echo "Commit: ${{ needs.pre-deploy-check.outputs.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "Review the changes and approve to continue..."
        shell: bash

  # ===========================================================================
  # DEPLOY VERCELL - Production deployment
  # ===========================================================================
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre-deploy-check, approval]
    if: ${{ needs.pre-deploy-check.outputs.ci_passed == 'true' }}
    environment: production
    outputs:
      # Publié pour le job smoke-tests. Sans ça il reconstruisait une URL
      # depuis VERCEL_PROJECT_ID, qui est un identifiant `prj_…` et non un
      # sous-domaine : l'URL ne résolvait jamais.
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (Production)
        id: deploy
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: false

  # ===========================================================================
  # DEPLOY SUPABASE - Database migrations
  # ===========================================================================
  deploy-supabase:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pre-deploy-check, approval]
    if: ${{ needs.pre-deploy-check.outputs.ci_passed == 'true' }}
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations to production
        run: |
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        working-directory: ./supabase

      - name: Verify migrations applied
        run: |
          supabase migration list --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # ===========================================================================
  # SMOKE TESTS - Post-deployment verification
  # ===========================================================================
  smoke-tests:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pre-deploy-check` doit figurer ici : sans lui,
    # `needs.pre-deploy-check.outputs.ci_passed` vaut la chaîne vide, la
    # condition est toujours fausse et le job ne s'exécute jamais — les smoke
    # tests post-déploiement ne tournaient donc pas une seule fois.
    needs: [pre-deploy-check, deploy-vercel, deploy-supabase]
    if: ${{ needs.pre-deploy-check.outputs.ci_passed == 'true' && github.event.inputs.skip_smoke_tests != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production URL
        env:
          # URL réelle produite par le déploiement. `vars.PRODUCTION_URL` sert
          # de repli quand le projet a un domaine personnalisé.
          DEPLOY_URL: ${{ needs.deploy-vercel.outputs.url }}
          FALLBACK_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          PROD_URL="${DEPLOY_URL:-$FALLBACK_URL}"
          if [ -z "$PROD_URL" ]; then
            echo "❌ Aucune URL de production. Définir la variable de dépôt PRODUCTION_URL."
            exit 1
          fi
          case "$PROD_URL" in https://*) ;; *) PROD_URL="https://$PROD_URL" ;; esac
          echo "Production URL: $PROD_URL"

          # Home page
          curl -f "$PROD_URL" -o /dev/null -w "%{http_code}" | grep -q "200"
          echo "✅ Home page OK"

          # Auth pages
          curl -f "$PROD_URL/fr/connexion" -o /dev/null -w "%{http_code}" | grep -q "200"
          echo "✅ Login page OK"
          curl -f "$PROD_URL/fr/inscription" -o /dev/null -w "%{http_code}" | grep -q "200"
          echo "✅ Signup page OK"

          echo "✅ All critical user flows verified"

  # ===========================================================================
  # NOTIFICATION - Deploy complete
  # ===========================================================================
  notify:
    name: Notify Deployment Complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Même raison que pour smoke-tests : le résumé lit
    # `needs.pre-deploy-check.outputs.sha`, qui rendait une chaîne vide tant
    # que le job n'était pas déclaré ici.
    needs: [pre-deploy-check, smoke-tests]
    if: always()
    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.smoke-tests.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ Production deployment completed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Production deployment failed. Check workflow logs." >> $GITHUB_OUTPUT
          fi

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary"
          echo ""
          echo "**Status:** ${{ steps.status.outputs.message }}"
          echo "**Commit:** ${{ needs.pre-deploy-check.outputs.sha }}"
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}"
          echo "**Triggered by:** ${{ github.actor }}"
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "### Deployed Components"
          echo "- ✅ Vercel (Next.js)"
          echo "- ✅ Supabase Migrations"
          echo ""
          echo "### Smoke Tests"
          echo "${{ needs.smoke-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}"
          echo ""
          echo "[View Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Fail if deployment failed
        if: ${{ steps.status.outputs.status == 'failure' }}
        run: exit 1
